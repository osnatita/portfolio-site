# Ita Skoblinski portfolio — Netlify config
# Deploys from GitHub (osnatita/portfolio-site) to the "portfolioevolved" site:
# pushing to main publishes, and a pull request gets its own deploy preview.

# Serve the French 404 for misses under /fr/. Verified on a deploy preview:
# without this rule, /fr/anything-missing returned the English page from the
# root, so the subdirectory 404.html was not being picked up on its own here.
# The rule is not forced, so real files under /fr/ still win over it.
[[redirects]]
  from = "/fr/*"
  to = "/fr/404.html"
  status = 404

# Each language of a localised landing page gets its own shareable URL.
# These are rewrites (status 200), not redirects: Netlify serves the same file
# and the address bar keeps /en, which is how the page knows which language to
# show. /terramadre2026/ is Italian, /terramadre2026/en is English.
[[redirects]]
  from = "/TerraMadre2026/en"
  to = "/TerraMadre2026/index.html"
  status = 200
[[redirects]]
  from = "/TerraMadre2026/en/"
  to = "/TerraMadre2026/index.html"
  status = 200
[[redirects]]
  from = "/terramadre2026/en"
  to = "/TerraMadre2026/index.html"
  status = 200
[[redirects]]
  from = "/terramadre2026/en/"
  to = "/TerraMadre2026/index.html"
  status = 200

# Localised landing pages live at a capitalised path (e.g. /TerraMadre2026).
# Netlify matches paths case-sensitively, so catch the lowercase spelling too.
[[redirects]]
  from = "/terramadre2026"
  to = "/TerraMadre2026/"
  status = 301

# The design portfolio answers to /design as well as to the root, so the two
# halves of the site can be named symmetrically (/design and /text). The root
# stays canonical; nothing moved.
[[redirects]]
  from = "/design"
  to = "/"
  status = 301

# Preserve the old /portfolio URL after moving the homepage to root
[[redirects]]
  from = "/portfolio"
  to = "/"
  status = 301
[[redirects]]
  from = "/portfolio.html"
  to = "/"
  status = 301

# Serve the merchant prototype's .jsx source as JavaScript
[[headers]]
  for = "/*.jsx"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Keep the whole site out of search engines (private / password-gated)
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"

# Force every file to revalidate so returning visitors never see a stale (old) version.
# ETag makes this cheap: unchanged files return a tiny 304, changed files are re-fetched.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
